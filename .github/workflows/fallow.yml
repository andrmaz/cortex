name: Fallow

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Audit changed code
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.fallow-audit.outputs.issues }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit changed code with Fallow
        id: fallow-audit
        uses: fallow-rs/fallow@71369f80d099e25726ad04382f15aef14a251abc # v3.31.0
        with:
          command: audit
          version: 3.31.0
          format: compact
          gate: new-only
          fail-on-issues: true
          comment: true

  fallow-failure-summary:
    name: Fallow failure summary
    needs: audit
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.audit.result == 'failure' &&
      needs.audit.outputs.issues == ''
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish failure summary
        env:
          CI_SUMMARY_NAME: fallow-startup
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Fallow summary"
            echo
            echo "Fallow failed before it produced an analysis report. See the [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) for diagnostics."
          } >> "$GITHUB_STEP_SUMMARY"
          node .github/scripts/ci-pr-summary.mjs
