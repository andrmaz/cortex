name: Fallow

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  audit:
    name: Audit changed code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit changed code with Fallow
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          version: 3.31.0
          format: compact
          gate: new-only
          fail-on-issues: true
